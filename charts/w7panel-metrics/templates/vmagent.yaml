apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
   name: {{ include "w7panel-metrics.fullname" . }}-agent
   labels:
         {{- include "w7panel-metrics.labels" . | nindent 4 }}
spec:
    managedMetadata:
        labels:
            w7.cc/group-name: {{ include "w7panel-metrics.fullname" . }}
    externalLabels: {}
    extraArgs:
        maxLabelsPerTimeseries: '300'
        promscrape.dropOriginalLabels: 'true'
        promscrape.streamParse: 'true'
    image:
        tag: v1.113.0
    license: {}
    port: '8429'
    # resources:
    #     # requests:
    #     #   memory: "64Mi"
    #     #   cpu: "250m"
    #     limits:
    #       memory: "512Mi"
    #       cpu: "500m"
    remoteWrite:
        -
            url: >-
                http://vmsingle-{{ include "w7panel-metrics.fullname" . }}-single.{{ .Release.Namespace }}.svc.cluster.local.:8429/api/v1/write
    scrapeInterval: 30s
    selectAllByDefault: true
